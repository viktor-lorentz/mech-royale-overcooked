[package]
name = "mech-sim"
version = "0.1.0"
edition = "2021"

# Not part of the root build.
[workspace]

[dependencies]
mech-bot = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
flate2 = "1"

[profile.release]
opt-level = 3
debug = false
panic = "unwind"
codegen-units = 16
